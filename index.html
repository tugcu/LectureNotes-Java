<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=WebContent/index.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <link rel="canonical" href="WebContent/index.html" />
  <script>
    (function () {
      // Preserve query string and hash (e.g., #mode=section&key=...).
      var path = window.location.pathname || "";
      // Normalize to the project root (…/LectureNotes-Java/).
      if (path.endsWith("/index.html")) path = path.slice(0, -"/index.html".length);
      if (!path.endsWith("/")) path += "/";

      var target =
        window.location.origin +
        path +
        "WebContent/index.html" +
        (window.location.search || "") +
        (window.location.hash || "");

      // Avoid redirect loops.
      if (!/\/WebContent\/index\.html$/.test(window.location.pathname || "")) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>
      Redirecting to <a href="WebContent/index.html">WebContent/index.html</a>…
    </p>
  </noscript>
</body>
</html>
